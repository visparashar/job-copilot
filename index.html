<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Copilot</title>
  <style>
    :root { --bg: #ffffff; --text: #0f172a; --muted: #475569; --accent: #4f46e5; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --text: #e2e8f0; --muted: #94a3b8; --accent: #a5b4fc; } }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; margin: 0; padding: 48px 16px; }
    main { max-width: 640px; margin: 0 auto; }
    p { color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <h1>⚡ Job Copilot</h1>
  <p>A Chrome extension that autofills job applications from your resume. 100% local and private.</p>
  <p><a href="privacy.html">Privacy policy</a> · <a href="https://buymeacoffee.com/visparasham">Buy me a coffee ☕</a></p>
</main>
</body>
</html>
